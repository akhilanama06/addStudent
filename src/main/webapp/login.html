<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
</head>
<body>

<h1>Add Student</h1>

<form action="add" method="post">

    <label>Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Branch:</label>
    <input type="text" name="branch" required>
    <br><br>

    <label>Marks:</label>
    <input type="number" name="marks" required>
    <br><br>

    <button type="submit">Add Student</button>

</form>

</body>
</html>
